name: BibleAI release journeys
on:
  push:
    branches: [codex/streak-listing, codex/todays-reading]
    paths:
      - 'BibleAI/**'
      - 'BibleAIUITests/**'
      - 'BibleAI.xcodeproj/**'
      - 'BibleAI.xcworkspace/**'
      - 'Podfile*'
      - '.github/workflows/bible-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journeys:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        journey: [testReadSaveNoteResumeAndSearch, testAppleSignInCancellation, testZShareAndInvitationJourney, testTodayTranslationAndStudyLibrary]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Select Xcode and install locked dependencies
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          pod_version=$(awk '/^COCOAPODS:/ {print $2}' Podfile.lock)
          gem install cocoapods --version "$pod_version" --no-document
          pod "_${pod_version}_" install --deployment
      - name: Run the native journey on a fresh iPhone simulator
        env:
          JOURNEY: ${{ matrix.journey }}
        run: |
          set -euo pipefail
          # Exercise the prepared study on a supported phone and OS without Apple Intelligence.
          phone=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          older = os.environ["JOURNEY"] == "testTodayTranslationAndStudyLibrary"
          family = ".iOS-18-" if older else ".iOS-26-"
          name = "iPhone SE (3rd generation)" if older else "iPhone 17 Pro"
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if family in runtime and device["name"] == name:
                      print(name, runtime, file=sys.stderr)
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(f"Missing {name} on {family}")')
          mkdir -p build/ci
          xcodebuild test -workspace BibleAI.xcworkspace -scheme BibleAIReaderTests \
            -destination "platform=iOS Simulator,id=$phone" -parallel-testing-enabled NO \
            "-only-testing:BibleAIUITests/ReaderJourneyTests/$JOURNEY" \
            -resultBundlePath build/ci/Journey.xcresult
      - name: Export actual UI captures and test counts
        if: always()
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments --path build/ci/Journey.xcresult --output-path build/ci/screens
          xcrun xcresulttool get test-results summary --path build/ci/Journey.xcresult --format json > build/ci/summary.json
          python3 -c 'import json; s=json.load(open("build/ci/summary.json")); assert s["passedTests"] == 1 and s["failedTests"] == 0 and s["skippedTests"] == 0, s'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.journey }}
          path: |
            build/ci/screens
            build/ci/summary.json
          if-no-files-found: error
          retention-days: 7
